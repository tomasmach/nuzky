[workspace]
resolver = "3"
members = ["crates/engine", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/tomasmach/capopen"

[workspace.dependencies]
capopen-engine = { path = "crates/engine" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
