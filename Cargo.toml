[workspace]
resolver = "3"
members = ["crates/engine", "crates/cli", "src-tauri", "crates/analysis", "crates/session", "crates/mcp", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
homepage = "https://nuzky.app"
repository = "https://github.com/tomasmach/nuzky"

[workspace.dependencies]
nuzky-session = { path = "crates/session" }
nuzky-mcp = { path = "crates/mcp" }
nuzky-agent = { path = "crates/agent" }
nuzky-analysis = { path = "crates/analysis" }
schemars = "1.2.2"
nuzky-engine = { path = "crates/engine" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
