[package]
name = "nuzky-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nuzky desktop video editor"

[lib]
name = "nuzky_app"
path = "src/lib.rs"

[[bin]]
name = "nuzky-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
nuzky-engine.workspace = true
nuzky-session.workspace = true
nuzky-mcp.workspace = true
nuzky-agent.workspace = true
nuzky-analysis.workspace = true
nuzky-vision.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
log.workspace = true
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
env_logger = "0.11"
tungstenite = "0.30"
cpal = "0.18.2"
rtrb = "0.4"
semver = "1.0.28"
png = "0.18"
base64 = "0.23"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
whisper-rs = "0.16.0"
ureq = "3.4.2"
sha2 = "0.11.0"
toml_edit = "0.25.15"
trash = "5.2.9"
unicode-normalization = "0.1.25"

[dev-dependencies]
ts-rs.workspace = true
nuzky-engine = { workspace = true, features = ["ts"] }
nuzky-mcp = { workspace = true, features = ["ts"] }

# How the UI flows drive the app on macOS (src/test_bridge.rs, debug builds only). wry already uses these crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSProcessInfo", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSButton", "NSControl", "NSEvent", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }

# Speech recognition on the GPU through Vulkan, verified on Linux so far.
[target.'cfg(target_os = "linux")'.dependencies]
nuzky-analysis = { workspace = true, features = ["gpu"] }
libc = "0.2.190"
