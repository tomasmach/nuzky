[package]
name = "nuzky-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nuzky desktop video editor"

[lib]
name = "nuzky_app"
path = "src/lib.rs"

[[bin]]
name = "nuzky-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
nuzky-engine.workspace = true
nuzky-session.workspace = true
nuzky-mcp.workspace = true
nuzky-agent.workspace = true
nuzky-analysis.workspace = true
nuzky-vision.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
log.workspace = true
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
env_logger = "0.11"
tungstenite = "0.30"
cpal = "0.18.2"
rtrb = "0.4"
semver = "1.0.28"
png = "0.18"
base64 = "0.23"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
whisper-rs = "0.16.0"
ureq = "3.4.2"
sha2 = "0.11.0"
toml_edit = "0.25.15"
trash = "5.2.9"
unicode-normalization = "0.1.25"

# Speech recognition on the GPU through Vulkan, verified on Linux so far.
[target.'cfg(target_os = "linux")'.dependencies]
nuzky-analysis = { workspace = true, features = ["gpu"] }
