[package]
name = "capopen-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "capopen"
path = "src/main.rs"

[dependencies]
capopen-engine.workspace = true
capopen-mcp.workspace = true
anyhow.workspace = true
serde_json.workspace = true
png = "0.18"
