[package]
name = "nuzky-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nuzky-engine = { workspace = true, features = ["schema"] }
nuzky-session.workspace = true
nuzky-analysis.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time", "sync"] }
base64 = "0.23.1"
png = "0.18.1"
log = "0.4"
ureq = "3.4.2"
sha2 = "0.11.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
