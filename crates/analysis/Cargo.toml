[package]
name = "nuzky-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
# candle-core uses NEON f16 intrinsics on Apple Silicon, stable since Rust 1.94.
rust-version = "1.94"

[features]
gpu = ["whisper-rs/vulkan"]

[dependencies]
nuzky-engine.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "6"
whisper-rs = "0.16.0"
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
unicode-normalization = "0.1.25"
rayon = "1"
libm = "0.2"

# Speech recognition on the GPU through Metal. whisper.cpp embeds its shaders in the binary.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[[bin]]
name = "nuzky-analyze"
path = "src/main.rs"
